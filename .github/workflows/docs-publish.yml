name: Publish Documentation

on:
  workflow_run:
    workflows: ["Documentation"]
    types: [completed]

jobs:
  docs-publish:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "push", "release"]'), github.event.workflow_run.event)
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@0bfa9822cc2df460b2172ec18f5acafa65316e68 # fix fork PR lookup after v0.0.3
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: write
    concurrency:
      group: docs-publish
      cancel-in-progress: false
      queue: max
