name: Format and Internal Tests of Utils 

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt.lock

      - name: Check formatting with Ruff
        run: ruff check . --exclude scripts/internal

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.26.0 # newest LTS before 1 Jun 2025
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          cache-version: utils-test
          # Restore on every run, but only write caches from pushes to main.
          cache-save: ${{ github.event_name == 'push' }}

      - name: Check pip lock is up to date with score_tooling
        run: bazel test //:requirements_test

      - name: Install Rust (Cargo)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: cargo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt.lock

      - name: Run tests with pytest
        run: pytest tests -v
